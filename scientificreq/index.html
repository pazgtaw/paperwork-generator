<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Services Request</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        .form-group input[type="checkbox"] {
            width: auto;
        }
        .output {
            margin-top: 20px;
            background: #f9f9f9;
            padding: 10px;
            border: 1px solid #ccc;
            white-space: pre-wrap;
        }
        button {
            padding: 10px 20px;
            cursor: pointer;
            margin-top: 10px;
        }
        h1, h2, h3 {
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 8px;
            text-align: left;
        }
        th {
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>San Andreas Department of Corrections and Rehabilitation</h1>
    <h2>Scientific Services Request</h2>

    <form id="bbcode-form">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" required>
        </div>
        <div class="form-group">
            <label for="rank">Rank:</label>
            <input type="text" id="rank" required>
        </div>
        <div class="form-group">
            <label for="articles">Articles of Evidence (separate by commas):</label>
            <input type="text" id="articles" required>
        </div>
        <div class="form-group">
            <label for="location">Current Location of Evidence (Evidence Locker etc..):</label>
            <input type="text" id="location" required>
        </div>
        <div class="form-group">
            <label for="details">Details:</label>
            <input type="text" id="details" required>
        </div>
        <div class="form-group">
            <label for="ooc">(( OOC Details (separate if with commas if multiple entries): ))</label>
            <input type="text" id="ooc" required>
        </div>
        <button type="button" onclick="generateBBCode()">Generate BBCode</button>
    </form>

    <div class="output" id="output"></div>
    <button onclick="copyBBCode()">Copy BBCode</button>
</div>

<script>
    function generateBBCode() {
        const name = document.getElementById('name').value;
        const rank = document.getElementById('rank').value;
        const articles = document.getElementById('articles').value.split(',').map(rel => `[*] ${rel.trim()}`).join('\n');
        const details = document.getElementById('details').value;
        const location = document.getElementById('location').value;
        const ooc = document.getElementById('ooc').value.split(',').map(rel => `[*] ${rel.trim()}`).join('\n');

        const bbcode = `[b]Name:[/b] ${name}
[b]Rank:[/b] ${rank}

[b]Articles of Evidence:[/b] [list] ${articles} [/list]
[b]Current Location of Evidence:[/b] ${location}

[b]Request Details:[/b] ${details}
[b]OOC Details:[/b]
[list]
${ooc}
[/list]`;

        document.getElementById('output').textContent = bbcode;
    }

    function copyBBCode() {
        const bbcode = document.getElementById('output').textContent;
        navigator.clipboard.writeText(bbcode).then(() => {
            alert('BBCode copied to clipboard');
        });
    }
</script>

</div>
</body>
</html>
