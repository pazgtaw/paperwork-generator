<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPAT Generator</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        .form-group input[type="checkbox"] {
            width: auto;
        }
        .output {
            margin-top: 20px;
            background: #f9f9f9;
            padding: 10px;
            border: 1px solid #ccc;
            white-space: pre-wrap;
        }
        button {
            padding: 10px 20px;
            cursor: pointer;
            margin-top: 10px;
        }
        h1, h2, h3 {
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 8px;
            text-align: left;
        }
        th {
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Los Santos County Sheriff's Department</h1>
    <h2>Validated Physical Ability Test</h2>
    <h3>Main Post WIP</h3>

    <form id="bbcode-form">
        <div class="form-group">
            <label for="date">Date (DD/MMM/YY)</label>
            <input type="text" id="date" required>
        </div>
        <div class="form-group">
            <label for="time">Time (HH:MM)</label>
            <input type="text" id="time" required>
        </div>
        <div class="form-group">
            <label for="applicants">Applicants (separate by commas)</label>
            <input type="text" id="applicants" required>
        </div>
        <div class="form-group">
            <label for="investigators">Investigators (separate by commas)</label>
            <input type="text" id="investigators" required>
        </div>
        <button type="button" onclick="generateBBCode()">Generate BBCode</button>
    </form>

    <div class="output" id="output"></div>
    <button onclick="copyBBCode()">Copy BBCode</button>
</div>

<script>
    function generateBBCode() {
        const date = document.getElementById('date').value;
        const time = document.getElementById('time').value;
        const applicants = document.getElementById('applicants').value.split(',').map(rel => `[*] ${rel.trim()}`).join('\n');
        const investigators = document.getElementById('investigators').value.split(',').map(rel => `[*] ${rel.trim()}`).join('\n');

        const bbcode = `[block=0,30,transparent,white]
[b]DATE AND TIME:[/b] ${date} - ${time}

[b]APPLICANT ATTENDANCE[/b]:
[list] ${applicants} [/list]

[B]INVESTIGATOR ATTENDANCE[/B]:
[list] ${investigators} [/list]
[/block]`;

        document.getElementById('output').textContent = bbcode;
    }

    function copyBBCode() {
        const bbcode = document.getElementById('output').textContent;
        navigator.clipboard.writeText(bbcode).then(() => {
            alert('BBCode copied to clipboard');
        });
    }
</script>

</div>
</body>
</html>
