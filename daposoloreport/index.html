<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAPO Solo Patrol Report Generator</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #eee;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #16213e 0%, #1a1a2e 100%);
            border-radius: 10px;
            border: 1px solid #0f3460;
        }
        
        .header img {
            max-width: 100px;
            margin-bottom: 10px;
        }
        
        .header h1 {
            margin: 5px 0;
            font-size: 1.4em;
            color: #00d92f;
        }
        
        .header h2 {
            margin: 5px 0;
            font-size: 1.1em;
            color: #fff;
            font-weight: normal;
        }
        
        .header h3 {
            margin: 5px 0;
            font-size: 0.9em;
            color: #aaa;
            font-weight: normal;
        }
        
        .section {
            background: #16213e;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #0f3460;
        }
        
        .section-title {
            font-size: 1.1em;
            font-weight: bold;
            color: #00d92f;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #0f3460;
        }
        
        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .form-group {
            flex: 1;
            min-width: 200px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85em;
            color: #aaa;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #0f3460;
            border-radius: 5px;
            background: #1a1a2e;
            color: #fff;
            font-size: 0.95em;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #00d92f;
        }
        
        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }
        
        .button-row {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        
        .btn-generate {
            background: #00d92f;
            color: #000;
        }
        
        .btn-generate:hover {
            background: #00ff3c;
        }
        
        .btn-copy {
            background: #0f3460;
            color: #fff;
        }
        
        .btn-copy:hover {
            background: #1a4a7a;
        }
        
        .btn-clear {
            background: #333;
            color: #fff;
        }
        
        .btn-clear:hover {
            background: #555;
        }
        
        .btn-add {
            background: #0f3460;
            color: #fff;
            padding: 10px 20px;
            font-size: 0.9em;
        }
        
        .btn-add:hover {
            background: #1a4a7a;
        }
        
        .btn-remove {
            background: #e94560;
            color: #fff;
            padding: 8px 15px;
            font-size: 0.85em;
            min-width: auto;
        }
        
        .btn-remove:hover {
            background: #ff6b6b;
        }
        
        .output-section {
            background: #16213e;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #0f3460;
        }
        
        .output-section h3 {
            color: #00d92f;
            margin-top: 0;
        }
        
        #output {
            width: 100%;
            min-height: 300px;
            padding: 15px;
            border: 1px solid #0f3460;
            border-radius: 5px;
            background: #1a1a2e;
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            resize: vertical;
        }
        
        .copy-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #00d92f;
            color: #000;
            padding: 15px 25px;
            border-radius: 5px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1000;
            font-weight: bold;
        }
        
        .copy-notification.show {
            opacity: 1;
        }
        
        .paperwork-entry {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: flex-end;
            flex-wrap: wrap;
            padding: 15px;
            background: #1a1a2e;
            border-radius: 5px;
            border: 1px solid #0f3460;
        }
        
        .paperwork-entry .form-group {
            margin-bottom: 0;
        }
        
        .paperwork-entry .form-group.name-group {
            flex: 2;
            min-width: 150px;
        }
        
        .paperwork-entry .form-group.link-group {
            flex: 3;
            min-width: 200px;
        }
        
        #paperworkContainer {
            margin-bottom: 15px;
        }
        
        .no-paperwork {
            color: #666;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }
        
        .add-paperwork-row {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>DEPARTMENT OF CORRECTIONS AND REHABILITATION</h1>
            <h2>DIVISION OF ADULT PAROLE OPERATIONS</h2>
            <h3>Solo Patrol Report Generator</h3>
        </div>
        
        <div class="section">
            <div class="section-title">REPORT INFORMATION</div>
            <div class="form-row">
                <div class="form-group">
                    <label>REPORT DATE</label>
                    <input type="text" id="reportDate" placeholder="DD/MMM/YYYY">
                </div>
                <div class="form-group">
                    <label>REPORT TIME</label>
                    <input type="text" id="reportTime" placeholder="HH:MM">
                </div>
                <div class="form-group">
                    <label>PATROL NUMBER</label>
                    <input type="text" id="patrolNumber" placeholder="e.g. 1, 2, 3...">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>APPRENTICE NAME</label>
                    <input type="text" id="apprenticeName" placeholder="Firstname Lastname">
                </div>
                <div class="form-group">
                    <label>APPRENTICE BADGE NUMBER</label>
                    <input type="text" id="apprenticeBadge" placeholder="Badge Number">
                </div>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">NARRATIVE OF PATROL</div>
            <div class="form-group">
                <textarea id="narrative" placeholder="Write the narrative of the patrol here..."></textarea>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">ASSOCIATED PAPERWORK</div>
            <div id="paperworkContainer">
                <div class="no-paperwork" id="noPaperworkMsg">No paperwork added yet. Click the button below to add.</div>
            </div>
            <div class="add-paperwork-row">
                <button class="btn btn-add" onclick="addPaperwork()">+ Add Paperwork</button>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">SIGNED</div>
            <div class="form-row">
                <div class="form-group">
                    <label>NAME</label>
                    <input type="text" id="signedName" placeholder="Firstname Lastname">
                </div>
                <div class="form-group">
                    <label>DATE</label>
                    <input type="text" id="signedDate" placeholder="DD/MMM/YYYY">
                </div>
            </div>
        </div>
        
        <div class="button-row">
            <button class="btn btn-clear" onclick="clearForm()">Clear Form</button>
            <button class="btn btn-generate" onclick="generateBBCode()">Generate BBCode</button>
            <button class="btn btn-copy" onclick="copyToClipboard()">Copy to Clipboard</button>
        </div>
        
        <div class="output-section">
            <h3>Generated BBCode</h3>
            <textarea id="output" readonly placeholder="Click 'Generate BBCode' to see the output here..."></textarea>
        </div>
    </div>
    
    <div class="copy-notification" id="copyNotification">Copied to clipboard!</div>
    
    <script>
        let paperworkCount = 0;
        
        function addPaperwork() {
            const container = document.getElementById('paperworkContainer');
            const noMsg = document.getElementById('noPaperworkMsg');
            
            if (noMsg) {
                noMsg.style.display = 'none';
            }
            
            paperworkCount++;
            
            const entry = document.createElement('div');
            entry.className = 'paperwork-entry';
            entry.id = 'paperwork-' + paperworkCount;
            entry.innerHTML = `
                <div class="form-group name-group">
                    <label>PAPERWORK NAME</label>
                    <input type="text" class="paperwork-name" placeholder="e.g. Checkup, Business Checkup">
                </div>
                <div class="form-group link-group">
                    <label>LINK</label>
                    <input type="text" class="paperwork-link" placeholder="https://...">
                </div>
                <button class="btn btn-remove" onclick="removePaperwork(${paperworkCount})">Remove</button>
            `;
            
            container.appendChild(entry);
        }
        
        function removePaperwork(id) {
            const entry = document.getElementById('paperwork-' + id);
            if (entry) {
                entry.remove();
            }
            
            const container = document.getElementById('paperworkContainer');
            const entries = container.querySelectorAll('.paperwork-entry');
            const noMsg = document.getElementById('noPaperworkMsg');
            
            if (entries.length === 0 && noMsg) {
                noMsg.style.display = 'block';
            }
        }
        
        function generateBBCode() {
            const reportDate = document.getElementById('reportDate').value;
            const reportTime = document.getElementById('reportTime').value;
            const patrolNumber = document.getElementById('patrolNumber').value;
            const apprenticeName = document.getElementById('apprenticeName').value;
            const apprenticeBadge = document.getElementById('apprenticeBadge').value;
            const narrative = document.getElementById('narrative').value;
            const signedName = document.getElementById('signedName').value;
            const signedDate = document.getElementById('signedDate').value;
            
            // Gather paperwork entries
            const paperworkEntries = document.querySelectorAll('.paperwork-entry');
            let paperworkBBCode = '';
            
            paperworkEntries.forEach(entry => {
                const name = entry.querySelector('.paperwork-name').value;
                const link = entry.querySelector('.paperwork-link').value;
                if (name || link) {
                    paperworkBBCode += `[url=${link || 'LINK HERE'}]${name || 'PAPERWORK'}[/url]\n`;
                }
            });
            
            if (!paperworkBBCode) {
                paperworkBBCode = 'No associated paperwork.';
            }
            
            const bbcode = `[divbox=white][center][imgmw=200]https://i.imgur.com/Tr8Gu0f.png[/imgmw]
[size=125]DEPARTMENT OF CORRECTIONS AND REHABILITATION[/size]
[size=115]DIVISION OF ADULT PAROLE OPERATIONS[/size]
[size=100]Solo Patrol Report - [color=#00d92f]TO BE FILLED OUT BY THE APPRENTICE[/color][/size]
[hr][/hr][/center]
[table2=1,black,transparent,Roboto]
[tr]
[tdwidth=1,black,transparent,top,left,33,5][b]REPORT DATE[/b][/tdwidth]
[tdwidth=1,black,transparent,top,left,33,5][b]REPORT TIME[/b][/tdwidth]
[tdwidth=1,black,transparent,top,left,33,5][b]PATROL NUMBER[/b][/tdwidth]
[/tr]
[tr]
[tdwidth=1,black,transparent,top,left,33,5]${reportDate}[/tdwidth]
[tdwidth=1,black,transparent,top,left,33,5]${reportTime}[/tdwidth]
[tdwidth=1,black,transparent,top,left,33,5]${patrolNumber}[/tdwidth]
[/tr]
[/table2]
[table2=1,black,transparent,Roboto]
[tr]
[tdwidth=1,black,transparent,top,left,50,5][b]APPRENTICE NAME[/b][/tdwidth]
[tdwidth=1,black,transparent,top,left,50,5][b]APPRENTICE BADGE NUMBER[/b][/tdwidth]
[/tr]
[tr]
[tdwidth=1,black,transparent,top,left,50,5]${apprenticeName}[/tdwidth]
[tdwidth=1,black,transparent,top,left,50,5]${apprenticeBadge}[/tdwidth]
[/tr]
[/table2]
[table2=1,black,transparent,Roboto]
[tr][tdwidth=2,black,transparent,top,center,500,5]
[center][b][size=120]NARRATIVE OF PATROL[/size][/b][/center]
[/tdwidth][/tr][/table2]
[table2=1,black,transparent,Roboto]
[tr]
[tdwidth=1,black,transparent,top,left,100,5]${narrative}
[/tdwidth]
[/tr]
[/table2]
[hr][/hr]
[table2=1,black,transparent,Roboto]
[tr][tdwidth=2,black,transparent,top,center,500,5]
[center][b][size=120]ASSOCIATED PAPERWORK[/size][/b][/center]
[/tdwidth][/tr][/table2]
[table2=1,black,transparent,Roboto]
[tr]
[tdwidth=1,black,transparent,top,left,100,5]${paperworkBBCode}[/tdwidth]
[/tr]
[/table2]
[hr][/hr]
[table2=1,black,transparent,Roboto]
[tr][tdwidth=2,black,transparent,top,center,500,5]
[b][size=120]SIGNED[/size][/b]
[/tdwidth][/tr][/table2]
[table2=1,black,transparent,Roboto]
[tr]
[tdwidth=1,black,transparent,top,left,50,5][b]NAME[/b][/tdwidth]
[tdwidth=1,black,transparent,top,left,50,5][b]DATE[/b][/tdwidth]
[/tr]
[tr]
[tdwidth=1,black,transparent,top,left,50,5]${signedName}[/tdwidth]
[tdwidth=1,black,transparent,top,left,50,5]${signedDate}[/tdwidth]
[/tr]
[/table2]
[/divbox]`;
            
            document.getElementById('output').value = bbcode;
        }
        
        function copyToClipboard() {
            const output = document.getElementById('output');
            output.select();
            output.setSelectionRange(0, 99999);
            document.execCommand('copy');
            
            const notification = document.getElementById('copyNotification');
            notification.classList.add('show');
            setTimeout(() => {
                notification.classList.remove('show');
            }, 2000);
        }
        
        function clearForm() {
            document.getElementById('reportDate').value = '';
            document.getElementById('reportTime').value = '';
            document.getElementById('patrolNumber').value = '';
            document.getElementById('apprenticeName').value = '';
            document.getElementById('apprenticeBadge').value = '';
            document.getElementById('narrative').value = '';
            document.getElementById('signedName').value = '';
            document.getElementById('signedDate').value = '';
            document.getElementById('output').value = '';
            
            // Clear paperwork entries
            const container = document.getElementById('paperworkContainer');
            const entries = container.querySelectorAll('.paperwork-entry');
            entries.forEach(entry => entry.remove());
            
            const noMsg = document.getElementById('noPaperworkMsg');
            if (noMsg) {
                noMsg.style.display = 'block';
            }
            
            paperworkCount = 0;
        }
    </script>
</body>
</html>
